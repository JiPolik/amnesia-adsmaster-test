apiVersion: amnesia/v1
kind: GeoPreset
metadata:
  name: us
spec:
  include:
  - type: COUNTRY
    value: US
---
apiVersion: amnesia/v1
kind: GeoPreset
metadata:
  name: worldwide_ex_sanctioned
spec:
  worldwide: true
  exclude:
  - type: COUNTRY
    value: UA
  - type: COUNTRY
    value: RU
  - type: COUNTRY
    value: BY
  - type: COUNTRY
    value: VE
  - type: COUNTRY
    value: IR
  - type: COUNTRY
    value: KP
  - type: COUNTRY
    value: CU
