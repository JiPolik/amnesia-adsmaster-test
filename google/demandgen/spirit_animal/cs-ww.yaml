apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: cs_ww_goog_dg_efaq_spiritanimal
  platform: google_demand_gen
  vertical: spirit_animal
  extends: spirit_animal_dg_tmpl
  geo_preset_ref: worldwide_ex_sanctioned
spec:
  budget_daily_usd: 1000.0
  target_cpa_usd: 18.0
  ad_sets:
  - name: multiasset
    ad_templates:
    - name: animals_watching
      destination_url: https://efaq.com/cs/spirit-animal/lp/quiz
      headlines:
      - Najdi své duchovní zvíře
      - Objev svou pravou podstatu
      - Poznej své vnitřní zvíře
      - Jaké jsi zvíře?
      - Tvé duchovní zvíře čeká
      descriptions:
      - Udělej si test a objev své duchovní zvíře během pár minut.
      - Odhal své instinkty a objev své duchovní zvíře ještě dnes.
      - Zajímá tě, jaké jsi zvíře? Zjisti to hned.
      - Které zvíře odpovídá tvé osobnosti? Udělej si test.
    - name: brunette_wolf
      destination_url: https://efaq.com/cs/spirit-animal/lp/quiz
      headlines:
      - Najdi své duchovní zvíře
      - Objev svou pravou podstatu
      - Poznej své vnitřní zvíře
      - Jaké jsi zvíře?
      - Tvé duchovní zvíře čeká
      descriptions:
      - Ve tobě je divoká stránka. Objev své duchovní zvíře.
      - Tvé instinkty říkají víc, než myslíš. Najdi své zvíře.
      - Jsi klidný, silný, nebo dravý? Odhal svou pravou podstatu.
      - Rychlý a silný test odhalí tvé vnitřní zvíře.
    - name: face_contrast
      destination_url: https://efaq.com/cs/spirit-animal/lp/quiz
      headlines:
      - Najdi své duchovní zvíře
      - Objev svou pravou podstatu
      - Poznej své vnitřní zvíře
      - Jaké jsi zvíře?
      - Tvé duchovní zvíře čeká
      descriptions:
      - Dvě strany, jedna pravda. Objev své duchovní zvíře během minut.
      - V tobě je i jiná stránka. Najdi své pravé zvíře.
      - Logika, nebo instinkt? Odhal své vnitřní zvíře.
      - Objev svou skrytou stránku. Udělej si test.
