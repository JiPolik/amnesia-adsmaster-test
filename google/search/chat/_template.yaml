apiVersion: amnesia/v1
kind: CampaignTemplate
metadata:
  name: chat_search_tmpl
  platform: google_search
  vertical: chat
  extends: efaq_base
spec:
  ad_sets:
  - name: generic
    ad_templates:
    - name: generic__rsa
      creative_feed_ref: chat_search_feed
      destination_url: https://efaq.com/chat/lp/chat
      headlines:
      - EFAQ.com - Official Site
      - Don't Waste Your Money
      - '{KeyWord:GPT AI} Powered Chat'
      - '{KeyWord:GPT AI} Unlimited'
      - Ask AI Anything
      - Fast, Accurate AI Chat
      - AI Chat for Everyone
      - Try AI Chat For Free
      - Access The Top AI Models
      - Generate Images With AI
      descriptions:
      - Chat with powerful AI models for answers, ideas, writing, and problem solving.
      - Stop overpaying for AI tools. Get fast, accurate AI chat in one place.
      - Ask anything and get clear responses instantly with advanced AI chat.
      - Unlimited AI conversations for work, learning, creativity, and daily tasks.
  - name: chatgpt
    ad_templates:
    - name: chatgpt__rsa
      creative_feed_ref: chat_search_feed
      destination_url: https://efaq.com/chat/lp/chat
      headlines:
      - EFAQ.com - Official Site
      - Don't Waste Your Money
      - Chat GPT Without Any Limits
      - ChatGPT, Grok, Claude and More
      - Start Chatting with GPT Now
      - Fast, Accurate AI Chat
      - AI Chat for Everyone
      - Try AI Chat For Free
      - Access The Top AI Models
      - Generate Images With AI
      - One Platform, Many AI Models
      - Try GPT Chat AI For Free
      descriptions:
      - Chat with powerful AI models for answers, ideas, writing, and problem solving.
      - Stop overpaying for AI tools. Get fast, accurate AI chat in one place.
      - Ask anything and get clear responses instantly with advanced AI chat.
      - Unlimited AI conversations for work, learning, creativity, and daily tasks.
