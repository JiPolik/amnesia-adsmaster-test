apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: tr_ww_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
spec:
  budget_daily_usd: 900.0
  target_cpa_usd: 10.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/tr/iq/lp/iq-test
      headlines:
      - EFAQ.com - Resmi Site
      - 20 Dakikada IQ'nu Ölç
      - Resmi IQ Testi 2026
      - En Doğru IQ Testi
      - Paranı Boşa Harcama
      - IQ Testine Başla
      - Ne Kadar Zekisin?
      - Hızlı ve Doğru Sonuçlar
      - Bilimsel Tasarlanmış Test
      - Gerçek IQ Testi Sonuçları
      - Arkadaşlarından Zeki misin?
      descriptions:
      - Ortalamadan daha zeki olduğunu mu düşünüyorsun? Testi çöz ve gerçek sıralamanı gör.
      - 10 dakikadan kısa sürede, telefonundan hızlı ve doğru IQ sonuçları al.
      - Uzmanların güvendiği, bilimsel olarak tasarlanmış IQ testi ile kesin sonuçlar.
      - Bugün IQ'sunu test eden binlerce kişiye katıl ve seviyeni tam olarak öğren.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      destination_url: https://efaq.com/tr/iq/lp/iq-test
      headlines:
      - EFAQ.com - Resmi Site
      - 20 Dakikada IQ'nu Ölç
      - Resmi IQ Testi 2026
      - En Doğru IQ Testi
      - Ne Kadar Zekiyim?
      - Ne Kadar Akıllısın?
      - Paranı Boşa Harcama
      - Online Zeka Testi
      descriptions:
      - Gerçekten ne kadar zeki olduğunu merak ettin mi? Testi çöz ve net cevaplar al.
      - Ortalama mı yoksa üstün zekalı mı olduğunu öğren. Hızlı ve doğru IQ sonuçları.
      - Tahmin etmeyi bırak. Zekanı gerçek bir IQ testi ile ölç. Puanını hemen öğren.
      - Aynı soruyu soran ve sonunda cevabını bulan binlerce kişiye katıl.
