apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: ro_ww_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
spec:
  budget_daily_usd: 800.0
  target_cpa_usd: 12.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/ro/iq/lp/iq-test
      headlines:
      - EFAQ.com - Site Oficial
      - Află IQ-ul în 20 Min
      - Test IQ Oficial 2026
      - Cel mai precis Test IQ
      - Nu irosi banii
      - Începe Testul de IQ
      - Cât de deștept ești?
      - Rezultate Rapide/Precise
      - Test Științific
      - Test IQ Real, Rezultate
      - Mai deștept ca amicii?
      descriptions:
      - Crezi că ești mai deștept decât media? Fă testul și vezi exact unde te situezi.
      - Obține rezultate IQ rapide și precise în sub 10 minute, direct pe telefonul tău.
      - Test de IQ conceput științific, utilizat de experți pentru rezultate precise.
      - Alătură-te miilor de oameni care și-au testat IQ-ul azi. Află scorul tău acum.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      destination_url: https://efaq.com/ro/iq/lp/iq-test
      headlines:
      - EFAQ.com - Site Oficial
      - Află IQ-ul în 20 Min
      - Test IQ Oficial 2026
      - Cel mai precis Test IQ
      - Cât de deștept sunt?
      - Cât de deștept ești?
      - Nu irosi banii
      - Test Inteligență Online
      descriptions:
      - Te-ai întrebat cât de deștept ești? Fă testul și primește răspunsuri clare.
      - Află dacă ești mediu, supradotat sau peste medie. Rezultate IQ rapide și exacte.
      - Nu mai ghici. Măsoară-ți inteligența cu un test IQ real. Află scorul acum.
      - Alătură-te miilor de oameni care și-au pus aceeași întrebare și au primit răspuns.
