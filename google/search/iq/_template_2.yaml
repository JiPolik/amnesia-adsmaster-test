apiVersion: amnesia/v1
kind: CampaignTemplate
metadata:
  name: iq_search_tmpl_2
  platform: google_search
  vertical: iq
  extends: efaq_base
spec:
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      creative_feed_ref: iq_search_feed
      destination_url: https://efaq.com/es-latam/iq/lp/iq-test
      headlines:
      - EFAQ.com - Sitio Oficial
      - Mide tu IQ en 20 Minutos
      - Test de IQ Oficial 2026
      - El Test de IQ Más Preciso
      - No Malgastes tu Dinero
      - Inicia tu Prueba de IQ
      - ¿Qué Tan Listo Eres?
      - Resultados Rápidos y Reales
      - Prueba Científica de IQ
      - Test Real, Resultados Reales
      - ¿Más Inteligente Que Otros?
      descriptions:
      - ¿Crees ser más listo que el promedio? Haz la prueba y descubre tu posición real.
      - Obtén resultados rápidos y precisos en menos de 10 minutos desde tu celular.
      - Prueba de IQ diseñada científicamente y avalada por expertos para darte precisión.
      - Únete a los miles que midieron su IQ hoy y descubre exactamente cuál es tu nivel.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      creative_feed_ref: iq_search_feed
      destination_url: https://efaq.com/es-latam/iq/lp/iq-test
      headlines:
      - EFAQ.com - Sitio Oficial
      - Mide tu IQ en 20 Minutos
      - Test de IQ Oficial 2026
      - El Test de IQ Más Preciso
      - ¿Qué Tan Inteligente Soy?
      - ¿Qué Tan Listo Eres?
      - No Malgastes tu Dinero
      - Test de Inteligencia Online
      descriptions:
      - ¿Alguna vez dudaste de tu inteligencia? Haz la prueba y obtén respuestas claras.
      - Descubre si eres promedio o superdotado. Resultados de IQ rápidos y precisos.
      - Deja de adivinar. Mide tu inteligencia con un test de IQ real. Obtén tu puntaje ya.
      - Únete a miles que se hicieron la misma pregunta y finalmente obtuvieron respuestas.
