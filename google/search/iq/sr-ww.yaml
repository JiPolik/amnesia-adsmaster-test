apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: sr_ww_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
spec:
  budget_daily_usd: 300.0
  target_cpa_usd: 15.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/sr/iq/lp/iq-test
      headlines:
      - EFAQ.com – Званичан сајт
      - Проверите ИК за 20 мин
      - Званични ИК тест 2026
      - Најпрецизнији ИК тест
      - Не бацајте новац
      - Започните ИК тест
      - Колико сте паметни?
      - Брзи и тачни резултати
      - Научно дизајниран тест
      - Прави тест, резултати
      - Паметнији од пријатеља?
      descriptions:
      - Мислите да сте паметнији од просека? Урадите тест и видите свој прави ранг.
      - Добијте брзе и тачне ИК резултате за мање од 10 минута, директно на телефону.
      - Научно дизајниран ИК тест коме верују стручњаци за прецизне резултате.
      - Придружите се хиљадама који су данас тестирали свој ИК и сазнајте свој ниво.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      destination_url: https://efaq.com/sr/iq/lp/iq-test
      headlines:
      - EFAQ.com – Званичан сајт
      - Проверите ИК за 20 мин
      - Званични ИК тест 2026
      - Најпрецизнији ИК тест
      - Колико сам паметан?
      - Колико сте паметни?
      - Не бацајте новац
      - Онлајн тест интелигенције
      descriptions:
      - Да ли сте се икада запитали колико сте заиста паметни? Урадите тест и сазнајте.
      - Сазнајте да ли сте просечни, надарени или изнад просека. Брзи ИК резултати.
      - Престаните да нагађате. Измерите своју интелигенцију правим ИК тестом данас.
      - Придружите се хиљадама који су поставили исто питање и коначно добили одговоре.
