      descriptions:
      - Мислите да сте паметнији од просека? Урадите тест и видите свој прави ранг.
      - Добијте брзе и тачне ИК резултате за мање од 10 минута, директно на телефону.
      - Научно дизајниран ИК тест коме верују стручњаци за прецизне резултате.
      - Придружите се хиљадама који су данас тестирали свој ИК и сазнајте свој ниво.
