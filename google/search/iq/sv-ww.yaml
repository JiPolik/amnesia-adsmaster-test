      - Gå med tusentals som testat sin IQ och se exakt hur du presterar.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      destination_url: https://efaq.com/sv/iq/lp/iq-test
      headlines:
      - EFAQ.com – Officiell sida
      - Testa din IQ på 20 minuter
      - Officiellt IQ-test 2026
      - Det mest exakta IQ-testet
      - Hur smart är jag?
      - Hur smart är du?
      - Slösa inte dina pengar
