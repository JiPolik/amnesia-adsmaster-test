      - Oled mõelnud, kui tark sa tegelikult oled? Tee test ja saa selged vastused.
      - Uuri, kas oled keskmine või andekas. Kiired ja täpsed IQ-tulemused.
      - Lõpeta oletamine. Mõõda oma intelligentsust päris IQ-testiga. Vaata oma skoori.
      - Liitu tuhandetega, kes küsisid sama küsimuse ja said lõpuks vastused.
