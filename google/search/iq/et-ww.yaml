  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
  ad_extension_refs:
  - callout_et_iq__breakdown
  - callout_et_iq__experts
  - callout_et_iq__fun_challenging
  - callout_et_iq__instant
  - callout_et_iq__mobile_friendly
