spec:
  budget_daily_usd: 900.0
  target_cpa_usd: 16.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/et/iq/lp/iq-test
      headlines:
      - EFAQ.com – Ametlik leht
      - Sinu IQ 20 minutiga
      - Ametlik IQ-test 2026
      - Kõige täpsem IQ-test
      - Ära raiska raha
      - Alusta oma IQ-testi
      - Kui tark sa oled?
      - Kiired ja täpsed tulemused
      - Teaduslikult loodud test
      - Päris test, päris vastused
      - Targem kui sõbrad?
      descriptions:
      - Arvad, et oled keskmisest targem? Tee test ja vaata, milline on sinu tegelik tase.
      - Saa kiired ja täpsed IQ-tulemused vähem kui 10 minutiga otse oma telefonis.
      - Teaduslikult välja töötatud IQ-test, mida eksperdid usaldavad täpsete tulemuste saamiseks.
      - Liitu tuhandetega, kes testisid oma IQ-d täna, ja saa teada oma täpne tase.
