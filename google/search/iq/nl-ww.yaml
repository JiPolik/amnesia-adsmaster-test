apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: nl_ww_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
spec:
  budget_daily_usd: 2500.0
  target_cpa_usd: 14.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/nl/iq/lp/iq-test
      headlines:
      - EFAQ.com - Officiële Site
      - Check uw IQ in 20 min
      - Officiële IQ-test 2026
      - De nauwkeurigste IQ-test
      - Verspil geen geld
      - Start uw IQ-test
      - Hoe slim bent u?
      - Snel & accuraat resultaat
      - Wetenschappelijke test
      - Echte test, echt resultaat
      - Slimmer dan uw vrienden?
      descriptions:
      - Denkt u slimmer te zijn dan gemiddeld? Doe de test en zie hoe u echt scoort.
      - Krijg snelle en nauwkeurige IQ-resultaten in minder dan 10 min, direct op uw mobiel.
      - Wetenschappelijk ontworpen IQ-test, vertrouwd door experts voor precieze resultaten.
      - Doe mee met duizenden die vandaag hun IQ testten en ontdek precies waar u staat.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      destination_url: https://efaq.com/nl/iq/lp/iq-test
      headlines:
      - EFAQ.com - Officiële Site
      - Check uw IQ in 20 min
      - Officiële IQ-test 2026
      - De nauwkeurigste IQ-test
      - Hoe slim ben ik?
      - Hoe slim bent u?
      - Verspil geen geld
      - Online intelligentietest
      descriptions:
      - Ooit afgevraagd hoe slim u echt bent? Doe de test en krijg duidelijke antwoorden.
      - Ontdek of u gemiddeld of hoogbegaafd bent. Snelle, nauwkeurige IQ-resultaten.
      - Stop met raden. Meet uw intelligentie met een echte IQ-test. Krijg nu uw score.
      - Sluit u aan bij duizenden die dezelfde vraag stelden en eindelijk antwoord kregen.
