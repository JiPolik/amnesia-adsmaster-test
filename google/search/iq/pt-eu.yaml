apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: pt_eu_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: europe
  ad_extension_refs:
  - callout_ptpt_iq__breakdown
  - callout_ptpt_iq__experts
  - callout_ptpt_iq__fun_challenging
  - callout_ptpt_iq__instant
  - callout_ptpt_iq__mobile_friendly
