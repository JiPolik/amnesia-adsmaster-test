spec:
  budget_daily_usd: 900.0
  target_cpa_usd: 20.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/pt/iq/lp/iq-test
      headlines:
      - EFAQ.com - Site Oficial
      - Teste o seu QI em 20 minutos
      - Teste de QI Oficial 2026
      - O teste de QI mais preciso
      - Não desperdice o seu dinheiro
      - Comece já o teste de QI
      - Quão inteligente é?
      - Resultados rápidos e precisos
      - Teste criado cientificamente
      - Teste real de QI, resultados
      - Mais inteligente que amigos?
      descriptions:
      - Acha que é mais inteligente que a média? Faça o teste e descubra o seu nível real.
      - Resultados de QI rápidos e precisos em menos de 10 minutos, em qualquer dispositivo.
      - Teste de QI cientificamente desenvolvido e utilizado por especialistas em avaliação.
      - Junte-se a milhares que já testaram o QI e veja exatamente como se posiciona.
    keywords:
    - text: iq test
      match_type: BROAD
    - text: iq test online
      match_type: BROAD
    - text: iq test free
      match_type: BROAD
