apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: no_ww_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
spec:
  budget_daily_usd: 3000.0
  target_cpa_usd: 27.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/no/iq/lp/iq-test
      headlines:
      - EFAQ.com – Offisiell side
      - Sjekk IQ-en på 20 minutter
      - Offisiell IQ-test 2026
      - Den mest presise IQ-testen
      - Ikke kast bort pengene
      - Start IQ-testen nå
      - Hvor smart er du?
      - Raske og presise resultater
      - Vitenskapelig utviklet test
      - Ekte IQ-test, ekte resultater
      - Smartere enn vennene dine?
      descriptions:
      - Tror du at du er smartere enn snittet? Ta testen og se hvor du virkelig ligger.
      - Få raske og nøyaktige IQ-resultater på under 10 minutter, rett på mobilen.
      - Vitenskapelig utviklet IQ-test brukt av eksperter for presise resultater.
      - Bli med tusenvis som har testet IQ-en sin og se nøyaktig hvordan du scorer.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      destination_url: https://efaq.com/no/iq/lp/iq-test
      headlines:
      - EFAQ.com – Offisiell side
      - Sjekk IQ-en på 20 minutter
      - Offisiell IQ-test 2026
      - Den mest presise IQ-testen
      - Hvor smart er jeg?
      - Hvor smart er du?
      - Ikke kast bort pengene
      - Intelligenstest på nett
      descriptions:
      - Har du lurt på hvor smart du egentlig er? Ta testen og få klare svar.
      - Finn ut om du er gjennomsnittlig, begavet eller over snittet. Rask IQ-test.
      - Slutt å gjette. Mål intelligensen din med en ekte IQ-test i dag.
      - Bli med tusenvis som stilte samme spørsmål og endelig fikk svar.
