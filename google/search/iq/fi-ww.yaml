apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: fi_ww_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
spec:
  budget_daily_usd: 2000.0
  target_cpa_usd: 16.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/fi/iq/lp/iq-test
      headlines:
      - EFAQ.com – Virallinen sivu
      - Testaa ÄO 20 minuutissa
      - Virallinen ÄO-testi 2026
      - Tarkin älykkyystesti
      - Älä tuhlaa rahojasi
      - Aloita älykkyystesti
      - Kuinka fiksu olet?
      - Nopeat ja tarkat tulokset
      - Tieteellinen testi
      - Oikea testi, oikeat tulokset
      - Fiksumpi kuin kaverit?
      descriptions:
      - Luuletko olevasi keskimääräistä fiksumpi? Tee testi ja selvitä todellinen sijoituksesi.
      - Saa nopeat ja tarkat ÄO-tulokset alle 10 minuutissa suoraan puhelimellasi.
      - Tieteellisesti suunniteltu älykkyystesti antaa tarkat ja luotettavat tulokset.
      - Liity tuhansien tänään testanneiden joukkoon ja selvitä oma älykkyysosamääräsi.
  - name: am_i_smart
    ad_templates:
    - name: am_i_smart__rsa
      destination_url: https://efaq.com/fi/iq/lp/iq-test
      headlines:
      - EFAQ.com – Virallinen sivu
      - Testaa ÄO 20 minuutissa
      - Virallinen ÄO-testi 2026
      - Tarkin älykkyystesti
      - Kuinka fiksu olen?
      - Kuinka fiksu olet?
      - Älä tuhlaa rahojasi
      - Älykkyystesti netissä
      descriptions:
      - Oletko miettinyt, kuinka fiksu oikeasti olet? Tee testi ja saa selkeät vastaukset.
      - Selvitä, oletko keskitasoa vai lahjakas. Nopeat ja tarkat tulokset.
      - Lopeta arvailu. Mittaa älykkyytesi oikealla ÄO-testillä. Katso pisteesi nyt.
      - Liity tuhansien saman kysymyksen esittäneiden joukkoon ja saa vastauksia.
