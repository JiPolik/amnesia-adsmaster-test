spec:
  budget_daily_usd: 1500.0
  target_cpa_usd: 15.0
  ad_sets:
  - name: iq_test
    ad_templates:
    - name: iq_test__rsa
      destination_url: https://efaq.com/cs/iq/lp/iq-test
      headlines:
      - EFAQ.com – Oficiální web
      - Otestujte své IQ za 20 min
      - Oficiální IQ test 2026
      - Nejpřesnější IQ test
      - Neplýtvejte penězi
      - Začněte svůj IQ test
      - Jak jste chytří?
      - Rychlé a přesné výsledky
      - Vědecky navržený test
      - Skutečný IQ test, výsledky
      - Chytřejší než přátelé?
      descriptions:
      - Myslíte si, že jste chytřejší než průměr? Udělejte test a zjistěte své místo.
      - Rychlé a přesné IQ výsledky do 10 minut, kdykoli, přímo ve vašem telefonu.
      - Vědecky navržený IQ test, kterému důvěřují odborníci pro přesné výsledky.
      - Přidejte se k tisícům lidí, kteří si dnes otestovali IQ a zjistili svou úroveň.
    keywords:
