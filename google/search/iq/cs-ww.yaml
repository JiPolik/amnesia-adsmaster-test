apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: cs_ww_goog_s_efaq_iq
  platform: google_search
  vertical: iq
  extends: iq_search_tmpl_1
  geo_preset_ref: worldwide_ex_sanctioned
  ad_extension_refs:
  - callout_cs_iq__breakdown
  - callout_cs_iq__experts
  - callout_cs_iq__fun_challenging
  - callout_cs_iq__instant
  - callout_cs_iq__mobile_friendly
  - callout_cs_iq__secure
