apiVersion: amnesia/v1
kind: CampaignTemplate
metadata:
  name: license_plate_search_tmpl
  platform: google_search
  vertical: license_plate
spec:
  objective: TRAFFIC
  status: PAUSED
  ad_set_defaults:
    status: PAUSED
    bid_strategy: TARGET_CPA
  ad_template_defaults:
    status: ENABLED
  ad_sets:
  - name: license_plate
    ad_templates:
    - name: license_plate__rsa
      creative_feed_ref: license_plate_search_feed
      destination_url: https://efaq.com/license-plate/lp/license-plate-lookup
      headlines:
      - EFAQ.com - Official Site
      - Don't Waste Your Money
      - License Plate Lookup
      - Check Any Plate in Seconds
      - Enter Plate and Hit Search
      - Lookup Car Records Instantly
      - Fast License Plate Search
      - See Accidents and Past Sales
      - Trusted Vehicle Reports
      - Your Search Is Private
      descriptions:
      - Enter any license plate to access vehicle history, accidents, past sales, and more.
      - Avoid costly surprises. Check accident records, theft reports, and title data.
      - Instant license plate lookup with detailed vehicle records in one report.
      - Trusted vehicle data from reliable sources. Fast, simple, and secure search.
