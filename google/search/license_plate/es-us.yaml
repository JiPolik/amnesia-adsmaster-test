apiVersion: amnesia/v1
kind: Campaign
metadata:
  name: es_us_goog_s_efaq_licenseplate
  platform: google_search
  vertical: license_plate
  extends: license_plate_search_tmpl
  geo_preset_ref: us
spec:
  budget_daily_usd: 300.0
  target_cpa_usd: 10.0
  ad_sets:
  - name: license_plate
    ad_templates:
    - name: license_plate__rsa
      destination_url: https://efaq.com/es-us/license-plate/lp/license-plate-lookup
      headlines:
      - EFAQ.com - Sitio Oficial
      - No Malgaste Su Dinero
      - Búsqueda de Placa
      - Revise Placas al Instante
      - Ingrese la Placa y Busque
      - Busque Récords de Autos
      - Búsqueda Rápida de Placa
      - Vea Accidentes y Ventas
      - Reportes Confiables
      - Su Búsqueda es Privada
      descriptions:
      - Ingrese cualquier placa para ver el historial del vehículo, accidentes, ventas y más.
      - Evite sorpresas costosas. Revise accidentes, reportes de robo y datos del título.
      - Búsqueda de placa instantánea con registros detallados del vehículo en un reporte.
      - Datos confiables de fuentes seguras. Búsqueda rápida, simple y privada.
